<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Michael Glanz – Einstieg</title>
  <meta name="description" content="Michael Glanz – Strategische Unternehmensberatung." />
  <style>
    :root {
      --bg: #05070a;
      --text: #f5f5f5;
      --muted: #bfbfbf;
      --accent: #00c9ff;
      --shadow: 0 30px 60px rgba(0,0,0,0.6);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #111827 0, #020308 55%, #000 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }

    .wrap {
      max-width: 760px;
      width: 100%;
    }

    .portrait-link {
      display: inline-block;
      text-decoration: none;
    }

    .portrait {
      width: 100%;
      max-width: 520px;
      border-radius: 22px;
      box-shadow: var(--shadow);
      display: block;
      margin: 0 auto 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
      margin: 0 0 0.8rem 0;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 42rem;
      margin: 0 auto 1.4rem auto;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 1.4rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffffff, var(--accent));
      color: #020617;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 16px 40px rgba(0, 201, 255, 0.35);
    }

    .hint {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="portrait-link" href="start.html" aria-label="Zur Website von Michael Glanz">
      <img class="portrait" src="bilder/DEIN-PORTRAIT.png" alt="Michael Glanz Unternehmensberatung" />
    </a>

    <h1>Michael Glanz – Unternehmensberatung</h1>
    <p>
      Strategische Beratung für Wachstum, Struktur und Effizienz.
      Klicken Sie auf das Porträt oder nutzen Sie den Button, um zur Website zu gelangen.
    </p>

    <a class="btn" href="start.html">Zur Website</a>
    <div class="hint">Porträt anklicken oder Button nutzen</div>
  </main>
</body>
</html>
