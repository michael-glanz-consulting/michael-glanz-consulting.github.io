  <style>
    :root {
      --bg: #05070a;
      --text: #f5f5f5;
      --muted: #bfbfbf;
      --accent: #00c9ff;
      --shadow: 0 30px 60px rgba(0,0,0,0.6);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #111827 0, #020308 55%, #000 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }

    .wrap {
      max-width: 760px;
      width: 100%;
    }

    .portrait {
      width: 100%;
      max-width: 520px;
      border-radius: 22px;
      box-shadow: var(--shadow);
      display: block;
      margin: 0 auto 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
      margin: 0 0 0.8rem 0;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 42rem;
      margin: 0 auto 1.4rem auto;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 1.4rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffffff, var(--accent));
      color: #020617;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 16px 40px rgba(0, 201, 255, 0.35);
    }

    .hint {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>

</head>

<body>

  <main class="wrap">

    <img class="portrait" src="bilder/DEIN-PORTRAIT.png" alt="Michael Glanz Unternehmensberatung für Wachstum und Struktur" />

    <h1>Unternehmensberatung für Wachstum und klare Strukturen</h1>

    <p>
      Ich unterstütze Unternehmen dabei, Wachstum zu strukturieren, Komplexität zu reduzieren und klare strategische Entscheidungen zu treffen.
    </p>

    <div class="buttons">
      <a class="btn" href="de.html">🇩🇪 Deutsche Website</a>
      <a class="btn" href="en.html">🇬🇧 English Website</a>
    </div>

    <div class="hint">Michael Glanz – Unternehmensberatung für Wachstum & Struktur</div>

  </main>

</body>
